service: milknthingzz
image: soadaa56/milknthingzz

servers:
  web:
    hosts:
      - 3.94.55.110

proxy:
  ssl: true
  hosts: 
    - filthychai.me
    - www.filthychai.me
  app_port: 3000

registry:
  username: "soadaa56"
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  clear:
    POSTGRES_HOST: "milknthingzz-db"
    POSTGRES_USER: "soadaa"
    POSTGRES_DB: "soadaa_production"  
  secret:
    - RAILS_MASTER_KEY
    - POSTGRES_PASSWORD
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY
    - STRIPE_PUBLISHABLE_KEY
    - STRIPE_SECRET_KEY

builder:
  args:
    RUBY_VERSION: 3.4.7
  arch:
    - amd64
  secrets:
    - RAILS_MASTER_KEY

volumes:
  - "storage:/rails/storage"
  - "uploads:/rails/public/uploads"
asset_path: /rails/public/assets
    
accessories:
  db: 
    image: postgres:15
    host: 3.94.55.110
    port: 5432
    env:
      clear:
        POSTGRES_USER: "soadaa"
        POSTGRES_DB: "soadaa_production"
        POSTGRES_HOST: "milknthingzz-db"
      secret:
        - POSTGRES_PASSWORD
    files:
      - db/production.sql:/docker-entrypoint-initdb.d/setup.sql
    directories:
      - data:/var/lib/postgresql/data
        
ssh:
  user: ubuntu
  keys:
    - ~/.ssh/LightsailDefaultKey-us-east-1.pem

aliases:
  console: app exec -i --reuse "bin/rails console"